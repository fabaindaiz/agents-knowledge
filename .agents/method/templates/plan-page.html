<!doctype html>
<!-- Generated by the release build from its original in the home repository's sources/bundle/; edit that, never this file. -->
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>{{title}}</title>
<!-- The plan page's template (`d-5ed7e8-09facc`): `bundle.py plan page` fills the title, lead and body slots from
the plan file's fixed sections. The layout puts the owner's question first, then where things stand, the device runs,
the milestones to try, what runs now per lane, what is the owner's, and the task tables with their totals. -->
<style>
:root{
  --bg:#FAF9FD; --fg:#2F3138; --muted:#5E6069; --line:#D5D6DE; --panel:#F2F2F8;
  --done:#1F5A4D; --doneBg:#D5ECE3; --run:#7A5530; --runBg:#FAE8D4; --wait:#5E6069; --waitBg:#E6E6EF;
  --bad:#8A2E38; --badBg:#F8DADD; --lane1:#4A5C88; --lane1Bg:#DDE1FB; --lane2:#1F5A4D; --lane2Bg:#D5ECE3;
  --you:#6A577E; --youBg:#EDDDF8;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E0F13; --fg:#E4E5EE; --muted:#A8A9B4; --line:#2B2D34; --panel:#17191F;
  --done:#76D0B5; --doneBg:#1E3530; --run:#F0BC80; --runBg:#3A2C1C; --wait:#A8A9B4; --waitBg:#262830;
  --bad:#F1B7BC; --badBg:#43242A; --lane1:#B8C9FB; --lane1Bg:#2A2F54; --lane2:#76D0B5; --lane2Bg:#1E3530;
  --you:#D8BDEE; --youBg:#3A2D46; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E0F13; --fg:#E4E5EE; --muted:#A8A9B4; --line:#2B2D34; --panel:#17191F;
  --done:#76D0B5; --doneBg:#1E3530; --run:#F0BC80; --runBg:#3A2C1C; --wait:#A8A9B4; --waitBg:#262830;
  --bad:#F1B7BC; --badBg:#43242A; --lane1:#B8C9FB; --lane1Bg:#2A2F54; --lane2:#76D0B5; --lane2Bg:#1E3530;
  --you:#D8BDEE; --youBg:#3A2D46; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.5;
  padding:24px max(16px,env(safe-area-inset-right,0px)) 56px max(16px,env(safe-area-inset-left,0px))}
main{max-width:1040px;margin:0 auto;display:grid;gap:32px}
h1{font-size:1.6rem;font-weight:600;margin:0;text-wrap:balance}
h2{font-size:1.15rem;font-weight:600;margin:0}
h3{font-size:1rem;font-weight:600;margin:0}
p{margin:0;max-width:74ch;text-wrap:pretty}
.lead,.note{color:var(--muted)} .note{font-size:.88rem}
section{display:grid;gap:14px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
th{font-size:.76rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
td.n{font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
code{font-size:.86em;overflow-wrap:anywhere}
li,p,td{overflow-wrap:anywhere}
.st{display:inline-block;font-size:.76rem;font-weight:600;border-radius:99px;padding:1px 9px}
.done{background:var(--doneBg);color:var(--done)} .run{background:var(--runBg);color:var(--run)}
.wait{background:var(--waitBg);color:var(--wait)} .bad{background:var(--badBg);color:var(--bad)}
.you{background:var(--youBg);color:var(--you)}
.box{background:var(--panel);border-radius:14px;padding:12px 16px;display:grid;gap:8px}
.hero{border:2px solid var(--done)}
ul,ol{margin:0;padding-left:20px;display:grid;gap:6px} li{max-width:78ch}
.cards{display:grid;gap:12px}
.card{display:grid;grid-template-columns:64px minmax(0,1fr);gap:14px;background:var(--panel);border-radius:16px;padding:14px 16px}
.tag{font-weight:600;align-self:start;justify-self:center;border-radius:12px;padding:6px 0;width:56px;text-align:center}
.card .body{display:grid;gap:6px;min-width:0}
.lanes{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:16px}
.lane{display:grid;gap:8px;align-content:start}
.lane:nth-child(odd) .st.lane-name{background:var(--lane1Bg);color:var(--lane1)}
.lane:nth-child(even) .st.lane-name{background:var(--lane2Bg);color:var(--lane2)}
.step{border-left:4px solid var(--line);padding:6px 10px;display:grid;gap:2px;font-size:.9rem}
.lane:nth-child(odd) .step{border-left-color:var(--lane1)} .lane:nth-child(even) .step{border-left-color:var(--lane2)}
.step .m{color:var(--muted);font-size:.84rem}
.ms{font-size:.8rem;font-weight:600;border-radius:8px;padding:2px 8px;justify-self:start;background:var(--doneBg);color:var(--done)}
</style>
</head>
<body>
<main>
  <header style="display:grid;gap:8px">
    <h1>{{title}}</h1>
    <p class="lead">{{lead}}</p>
  </header>
{{body}}
</main>
</body>
</html>
