name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  bundle:
    # The oldest supported Python the tools promise (3.11, for `tomllib`) and a current one: a CI that
    # tests only the newest lets a construct the oldest lacks reach a carrier.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Tool self-tests
        run: python3 .agents/tools/bundle.py selftest
      - name: Digests, provenance, links, reachability, sessions and privacy
        run: python3 .agents/tools/bundle.py digest .agents --check
      - name: The experiment's tasks are valid (each grader seen to fail and pass)
        run: python3 evals/harness.py check
      - name: Privacy of the repository's own published files
        run: python3 .agents/tools/bundle.py privacy --paths README.md AGENTS.md CLAUDE.md CONTRIBUTING.md .github/workflows/check.yml .githooks/pre-commit .claude/hooks/privacy_guard.py $(git ls-files evals)
